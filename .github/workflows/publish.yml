name: Publish to PyPI

# v* tags publish uncredit; git-deai-v* tags publish the git-deai transition package from
# legacy/git-deai. One workflow, so one trusted publisher entry per PyPI project.
on:
  push:
    tags:
      - 'v*'
      - 'git-deai-v*'
  # Runs the gates of one package alone, without an upload, to check them off a tag.
  workflow_dispatch:
    inputs:
      package:
        description: Package whose gates run
        type: choice
        options: [uncredit, git-deai]
        default: uncredit

jobs:
  # Each run checks one package: both gate calls name their files publish-gates-dist.
  gates:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.package == 'uncredit'
    uses: NaNIsaac/.github/.github/workflows/publish-gates.yml@9e87afaf228b87917fb071b4a86b1f10403fe0d5
    permissions:
      contents: read
    with:
      import-name: uncredit
      test-command: uv run --with pytest pytest -q
      smoke: uncredit --help
      # placeholder home folder in the README's sample output (and in this file, which the sdist carries)
      path-allowlist: |
        /home/me

  gates-git-deai:
    if: startsWith(github.ref, 'refs/tags/git-deai-v') || inputs.package == 'git-deai'
    uses: NaNIsaac/.github/.github/workflows/publish-gates.yml@9e87afaf228b87917fb071b4a86b1f10403fe0d5
    permissions:
      contents: read
    with:
      import-name: git_deai_legacy
      package-dir: legacy/git-deai
      tag-prefix: git-deai-v
      # the package has no tests of its own; its one command must start uncredit
      test-command: uv run deai --help
      smoke: deai --help

  publish:
    needs: gates
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # PyPI Trusted Publishing
      contents: read
    steps:
      # The files the gates checked, not a new build
      - uses: actions/download-artifact@v8
        with:
          name: publish-gates-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-git-deai:
    needs: gates-git-deai
    if: startsWith(github.ref, 'refs/tags/git-deai-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # PyPI Trusted Publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: publish-gates-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
